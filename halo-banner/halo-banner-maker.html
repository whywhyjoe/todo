<style id="dcs-workbench">
/* @inline dcs-workbench.css - generated block, do not hand-edit.
  Edit the sibling dcs-workbench.css and re-run: python inline-css.py */
/* ============================================================================
   DCS WORKBENCH — design system starter
   v1.0 · internal developer tooling · dark only

   Drop this into any new tool, or paste the :root block + the components you
   actually use inline. It is deliberately dependency-free and copy-safe:
   no build step, no CDN, no icon package, no @import.

   Layers:
     L1 WORKBENCH  full-screen takeover under the SharePoint suite bar.
                   .dcs-app shell, panels, splitters, sidebar, data grid.
     L2 INSTRUMENT single-purpose tool inside one web part, in flow.
                   .dcs-tool shell, control panel, canvas.

   Tokens below are the DCSPad set, unchanged, plus additions marked NEW.
   Existing DCSPad class names are NOT renamed — this file adds `dcs-`
   prefixed components alongside them.
   ========================================================================= */

:root {
  color-scheme: dark;

  /* --- surfaces ------------------------------------------------------- */
  --bg-0: #14161b;          /* app ground, gutters, splitter tracks */
  --bg-1: #1a1d23;          /* panel bodies, cards */
  --bg-2: #20242c;          /* chrome: topbar, panel heads, tab strips, status */
  --bg-3: #2a2f3a;          /* hover / pressed / segmented fill */
  --bg-editor: #17191f;     /* code ground (mirrored in the Monaco theme) */
  --border: #2a2e38;        /* structural hairlines — opaque by design */
  --border-strong: #3a4150; /* edges of interactive things */
  --border-mid: #333947;    /* segmented dividers / hover step */
  --surround: #101216;      /* hosted SharePoint surround */

  /* --- text ----------------------------------------------------------- */
  --fg-strong: #f2f5fa;     /* hover / emphasis / selected-row text */
  --fg: #e6e9ef;            /* primary text */
  --fg-row: #d4d9e2;        /* list & menu row resting text */
  --fg-dim: #a2a9b8;        /* labels, inactive tabs, icon buttons at rest */
  --fg-mid: #8b93a3;        /* panel-glyph strokes, secondary glyphs */
  --fg-faint: #6d7484;      /* timestamps, hints, gutter numbers — NEVER body */
  --fg-ghost: #4a5060;      /* splitter handles, disabled edges */

  /* --- accent — one accent. Solid fill appears exactly once per screen. */
  --accent: #3fd8b4;
  --accent-hi: #5ee3c4;
  --accent-ink: #04241e;         /* ink on solid accent fills */
  --accent-dim: #58bfa8;         /* quiet accent glyphs */
  --accent-soft: #1e3b35;        /* accent-soft surface */
  --accent-soft-line: #35695c;
  --accent-soft-fg: #79e0c6;
  --accent-line: #2c6a5c;
  --accent-ring: #182b28;        /* focus-ring wash */

  /* --- signals — status only, never decoration ------------------------ */
  --ok: #57d18a;            --ok-soft: #16321f;      --ok-soft-line: #2b5a38;
  --warn: #e8b660;          --warn-soft: #2a2112;    --warn-soft-line: #554323;
  --error: #ff6b62;         --error-fg: #ff8b82;     --error-bg: #2a1512;
  --error-soft-line: #3a1c1a; --error-deep: #2a0705; --error-muted: #c9948e;
  --info: #67a7f7;
  --info-soft: #1c2a38;     --info-soft-line: #2d4761;   /* NEW: blue soft pair */

  /* --- file-type BADGES ------------------------------------------------
     DCSPad's original triple, names unchanged: -fg is the badge's text and
     glyph colour, -bg its ground, -line its border. These style the little
     "js" / "html" pill — they are NOT the node-icon tokens (see below). */
  --ft-js-fg: #e3ce7a;   --ft-js-bg: #332e18;   --ft-js-line: #514a28;
  --ft-html-fg: #e5a06a; --ft-html-bg: #33251b; --ft-html-line: #543c2b;
  --ft-css-fg: #7eb6e8;  --ft-css-bg: #1c2a38;  --ft-css-line: #2d4761;
  --ft-json-fg: #a9c98a; --ft-json-bg: #21281a; --ft-json-line: #3b4a2f; /* NEW */
  --ft-doc-fg: #b6a8de;  --ft-doc-bg: #241f33;  --ft-doc-line: #3d3557;  /* NEW */

  /* --- NEW: node ICONS, two tiers -------------------------------------
     The bare name IS the resting state, because rest is what the whole list
     does. Low chroma: type stays legible, but 200 rows read as one calm list
     instead of a kaleidoscope. You opt INTO brightness with -active, which is
     rationed — the folder you are inside, the selected row, a filter match, a
     file changed since last sync. If everything is active, nothing is.
     Each tier is a stroke + -fill pair. Separate from the badge triple above:
     a node token paints an icon, a -fg token paints a pill. */
  --node-user: #5b9184;  --node-user-fill: #1b2926;
  --node-lib:  #5d7f9e;  --node-lib-fill:  #1b2430;
  --node-sys:  #565c6a;  --node-sys-fill:  transparent;
  --node-file: #7a8190;  --node-file-fill: transparent;
  --node-js:   #9a9068;  --node-js-fill:   #24221a;
  --node-html: #9d7d64;  --node-html-fill: #251f1a;
  --node-css:  #6f8ba6;  --node-css-fill:  #1b232b;
  --node-json: #7f9070;  --node-json-fill: #1e2119;
  --node-doc:  #86809e;  --node-doc-fill:  #211f29;
  /* -active — the called-out tier. File types borrow the badge hue so a
     selected file and its badge agree; folders get their own bright pair. */
  --node-user-active: var(--accent);      --node-user-active-fill: #1e3b35;
  --node-lib-active:  var(--info);        --node-lib-active-fill:  #1c2a38;
  --node-sys-active:  var(--fg-dim);      --node-sys-active-fill:  transparent;
  --node-file-active: var(--fg-dim);      --node-file-active-fill: transparent;
  --node-js-active:   var(--ft-js-fg);    --node-js-active-fill:   var(--ft-js-bg);
  --node-html-active: var(--ft-html-fg);  --node-html-active-fill: var(--ft-html-bg);
  --node-css-active:  var(--ft-css-fg);   --node-css-active-fill:  var(--ft-css-bg);
  --node-json-active: var(--ft-json-fg);  --node-json-active-fill: var(--ft-json-bg);
  --node-doc-active:  var(--ft-doc-fg);   --node-doc-active-fill:  var(--ft-doc-bg);
  /* The current folder — the one row allowed to be brighter than -active. */
  --node-open: var(--accent-hi);  --node-open-fill: #24463e;

  /* --- shape / elevation / type --------------------------------------- */
  --shadow-pop: 0 10px 28px -10px #000d;   /* the only shadow in the system */
  --radius-s: 3px; --radius-m: 4px; --radius-l: 6px;
  --mono: "Cascadia Code", "Consolas", "SF Mono", Menlo, monospace;
  --sans: "Segoe UI", system-ui, sans-serif;

  /* --- motion (NEW: named, so tools stop inventing durations) --------- */
  --ease: cubic-bezier(.35, 0, .25, 1);
  --dur-tint: .12s;   /* hover / color-only changes */
  --dur-move: .22s;   /* panels opening, chrome sliding */
  --dur-beat: .46s;   /* a result arriving: pop, flash, sweep-in */
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

/* ============================================================================
   L1 — WORKBENCH SHELL
   ========================================================================= */

.dcs-app {
  display: grid;
  grid-template-rows: 40px 1fr 24px;   /* topbar · work · status */
  height: 100vh;
  background: var(--bg-0);
  color: var(--fg);
  font: 13px/1.5 var(--sans);
  overflow: hidden;
}

/* Hosted in SharePoint: pin over the viewport under the 48px suite bar and
   paint the surround yourself — SP wrappers behind the gap are white. */
html.dcs-hosted { background: var(--surround); }
html.dcs-hosted body { background: var(--surround); }
html.dcs-hosted .dcs-app {
  position: fixed; inset: 53px 5px 5px; z-index: 999;
  height: auto; border-radius: var(--radius-l); overflow: hidden;
  box-shadow: 0 0 0 100vmax var(--surround);
  transition: top var(--dur-move) ease;
}
html.dcs-hosted.dcs-chrome-hidden .dcs-app { top: 5px; }
html.dcs-hosted #SuiteNavWrapper { filter: grayscale(1) brightness(.6); }

.dcs-topbar {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  padding: 0 8px 0 12px;
}
.dcs-topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.dcs-statusbar {
  display: flex; align-items: center; gap: 14px;
  background: var(--bg-2); border-top: 1px solid var(--border);
  padding: 0 12px; font: 11px/1 var(--mono); color: var(--fg-dim);
}
.dcs-status-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* --- wordmark: mono, split weight, accent on the second half ---------- */
.dcs-wordmark {
  font: 700 15px/1 var(--mono); letter-spacing: .02em;
  color: var(--fg); user-select: none;
}
.dcs-wordmark b { color: var(--accent); font-weight: 700; }

/* --- panel ------------------------------------------------------------ */
.dcs-panel {
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  background: var(--bg-1);
}
.dcs-panel-head {
  display: flex; align-items: center; gap: 6px; min-height: 30px;
  padding: 0 6px 0 12px;
  background: var(--bg-2); border-bottom: 1px solid var(--border);
}
.dcs-panel-title {
  font: 700 10px/1 var(--sans); text-transform: uppercase;
  letter-spacing: .14em; color: var(--fg-dim);
}
.dcs-panel-spacer { flex: 1; }
.dcs-panel-tools { display: inline-flex; align-items: center; gap: 4px; }
.dcs-panel-body { flex: 1 1 auto; min-height: 0; overflow: auto; }

/* --- splitter: 5px track, 26×1 handle, whole track lights on drag ----- */
.dcs-splitter { position: relative; z-index: 5; background: transparent; }
.dcs-splitter::after {
  content: ""; position: absolute; inset: 0;
  background: var(--accent); opacity: 0; transition: opacity var(--dur-tint);
}
.dcs-splitter:hover::after, .dcs-splitter.is-dragging::after { opacity: 1; }
.dcs-splitter::before {
  content: ""; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); background: var(--fg-ghost); z-index: 1;
}
.dcs-splitter-v { width: 5px; cursor: col-resize; }
.dcs-splitter-v::before { width: 1px; height: 26px; }
.dcs-splitter-h { height: 5px; cursor: row-resize; }
.dcs-splitter-h::before { width: 26px; height: 1px; }

/* ============================================================================
   L2 — INSTRUMENT SHELL (single-purpose tool inside one web part)
   No takeover, no status bar, no splitters. It paints its own dark ground
   so it reads as an instrument dropped onto the page, not a themed page.
   ========================================================================= */

.dcs-tool {
  display: flex; flex-direction: column;
  background: var(--bg-0); color: var(--fg);
  border: 1px solid var(--border); border-radius: var(--radius-l);
  font: 13px/1.5 var(--sans);
  overflow: hidden;
}
.dcs-tool-head {
  display: flex; align-items: center; gap: 10px; flex: none;
  min-height: 40px; padding: 0 10px 0 14px;
  background: var(--bg-2); border-bottom: 1px solid var(--border);
}
.dcs-tool-title { font: 600 13.5px/1 var(--sans); color: var(--fg-strong); }
.dcs-tool-title b { color: var(--accent); font-weight: 600; }
.dcs-tool-head .dcs-tool-actions { margin-left: auto; display: flex; gap: 6px; }

/* Body: controls beside canvas at ≥720px, stacked below. */
.dcs-tool-body { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.dcs-tool-body.has-canvas { grid-template-columns: minmax(280px, 360px) 1fr; }
@media (max-width: 720px) { .dcs-tool-body.has-canvas { grid-template-columns: 1fr; } }

.dcs-controls {
  display: flex; flex-direction: column; gap: 0;
  padding: 4px 0 10px; overflow: auto; background: var(--bg-1);
  border-right: 1px solid var(--border);
}
.dcs-tool-body:not(.has-canvas) .dcs-controls { border-right: 0; }

.dcs-canvas {
  position: relative; min-width: 0; display: flex; flex-direction: column;
  background: var(--bg-0);
}
.dcs-canvas-bar {
  display: flex; align-items: center; gap: 6px; flex: none;
  min-height: 30px; padding: 0 8px 0 12px;
  background: var(--bg-2); border-bottom: 1px solid var(--border);
}
.dcs-canvas-stage {
  flex: 1; min-height: 0; overflow: auto; padding: 16px;
  display: grid; place-items: center;
  /* 8px lattice so an artboard's real edges are readable on the dark ground */
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 24px 24px, 24px 24px;
  background-color: var(--bg-0);
}

/* --- resize rail (NEW) -------------------------------------------------
   A draggable boundary that resizes ONE thing instead of splitting two.
   Halo's banner preview is the reference case: the rail rides the edge of
   the artboard and drags its width, so the banner can be lined up against a
   real column. Splitter vocabulary — but the rail is drawn at rest, because
   there is no second pane to imply it and it has to announce itself.
     <div class="dcs-resize-rail dcs-tip-host" role="separator"
          aria-orientation="vertical" tabindex="0" aria-label="Resize preview">
       <span class="dcs-resize-grip"></span>
       <span class="dcs-tip">Drag to resize preview</span>
     </div>
   JS adds .is-dragging for the duration of the drag. Not a slider: no value,
   no readout, no ticks. If the number matters, use .dcs-slider instead. */
.dcs-resize-rail {
  position: relative; flex: none; align-self: stretch;
  width: 11px; display: flex; align-items: center; justify-content: center;
  background: transparent; cursor: col-resize; outline: none;
  touch-action: none; user-select: none;
}
.dcs-resize-rail::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
  width: 1px; transform: translateX(-.5px);
  background: var(--border-strong); transition: background var(--dur-tint);
}
.dcs-resize-rail:hover::before,
.dcs-resize-rail:focus-visible::before,
.dcs-resize-rail.is-dragging::before { background: var(--accent); }

.dcs-resize-grip {
  position: relative; z-index: 1; width: 7px; height: 26px;
  border-radius: var(--radius-s);
  background: var(--bg-2); border: 1px solid var(--border-strong);
  transition: background var(--dur-tint), border-color var(--dur-tint), box-shadow var(--dur-tint);
}
.dcs-resize-grip::after {   /* the splitter's 1px score, stood upright */
  content: ""; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 1px; height: 12px; background: var(--fg-ghost);
  transition: background var(--dur-tint);
}
.dcs-resize-rail:hover .dcs-resize-grip,
.dcs-resize-rail:focus-visible .dcs-resize-grip,
.dcs-resize-rail.is-dragging .dcs-resize-grip { border-color: var(--accent); }
.dcs-resize-rail:hover .dcs-resize-grip::after,
.dcs-resize-rail.is-dragging .dcs-resize-grip::after { background: var(--accent); }
.dcs-resize-rail.is-dragging .dcs-resize-grip { background: var(--bg-3); }
.dcs-resize-rail:focus-visible .dcs-resize-grip { box-shadow: 0 0 0 3px var(--accent-ring); }

/* Horizontal variant — drags a height. */
.dcs-resize-rail-h { width: auto; height: 11px; align-self: auto; cursor: row-resize; }
.dcs-resize-rail-h::before {
  top: 50%; bottom: auto; left: 0; right: 0;
  width: auto; height: 1px; transform: translateY(-.5px);
}
.dcs-resize-rail-h .dcs-resize-grip { width: 26px; height: 7px; }
.dcs-resize-rail-h .dcs-resize-grip::after { width: 12px; height: 1px; }

/* --- control group ---------------------------------------------------- */
.dcs-group { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; }
.dcs-group + .dcs-group { border-top: 1px solid var(--border); }
.dcs-group-title {
  font: 700 9.5px/1 var(--sans); text-transform: uppercase;
  letter-spacing: .14em; color: var(--fg-dim);
}
/* Two controls per row when they're short. */
.dcs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.dcs-row-3 { grid-template-columns: repeat(3, 1fr); }
.dcs-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.dcs-label {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font: 500 11.5px/1.2 var(--sans); color: var(--fg-dim);
}
.dcs-value { font: 500 11.5px/1 var(--mono); color: var(--fg-row); }
.dcs-hint { font: 10.5px/1.4 var(--sans); color: var(--fg-faint); }

/* ============================================================================
   CONTROLS — one system, height-tiered by CONTAINER, not by taste:
     lg 28  topbar / tool header
     md 26  the default — view toolbars, dialogs, control panels, forms
     sm 22  panel heads and inline toolbars
     xs 20  escape hatch (see .dcs-microbar) — only inside an already-tight
            strip, welded into one group, glyph-only, title on every control
   Never mix two tiers in one row.
   ========================================================================= */

.dcs-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 26px; padding: 0 12px;
  background: transparent; color: var(--fg-dim);
  border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  font: 500 12px/1 var(--sans); cursor: pointer;
  transition: background var(--dur-tint), border-color var(--dur-tint), color var(--dur-tint);
}
.dcs-btn:hover { background: var(--bg-3); color: var(--fg); }
.dcs-btn:focus-visible { outline: 2px solid var(--accent-soft-line); outline-offset: 1px; }
.dcs-btn:disabled { color: var(--fg-ghost); border-color: var(--border); cursor: default; background: transparent; }
.dcs-btn-lg { height: 28px; padding: 0 13px; }
.dcs-btn-sm { height: 22px; padding: 0 8px; font-size: 11px; }
.dcs-btn-xs { height: 20px; padding: 0 6px; font-size: 10.5px; }
.dcs-btn-ghost { border-color: transparent; }
.dcs-btn-ghost:hover { background: var(--bg-3); color: var(--fg); }
.dcs-btn-icon { width: 26px; padding: 0; }
.dcs-btn-sm.dcs-btn-icon { width: 22px; }
.dcs-btn-xs.dcs-btn-icon { width: 20px; }

/* --- microbar: the XS escape hatch -------------------------------------
   A whole toolbar inside a 22px strip — DCSPad's Browser address bar is the
   reference case: six controls and a live URL inside a 230px sidebar. The
   controls are WELDED into one bordered strip with 1px dividers; six loose
   20px buttons at this scale read as confetti. Glyph-only, and every child
   carries a title/aria-label because the glyph is doing all the work.
   Do not build a whole view out of this. */
.dcs-microbar {
  display: flex; flex: 1 1 auto; min-width: 0; height: 22px; overflow: hidden;
  background: var(--bg-1); border: 1px solid var(--border-strong);
  border-radius: var(--radius-m);
  transition: border-color var(--dur-tint), box-shadow var(--dur-tint);
}
.dcs-microbar:focus-within { border-color: var(--accent-soft-line); box-shadow: 0 0 0 2px var(--accent-ring); }
.dcs-microbar input,
.dcs-microbar > .dcs-microbar-value {
  flex: 1 1 auto; min-width: 0; padding: 0 7px;
  display: flex; align-items: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--fg-row); background: transparent; border: 0; outline: 0;
  font: 500 10.5px/1 var(--mono);
}
.dcs-microbar input::placeholder { color: var(--fg-faint); }
.dcs-microbar > button,
.dcs-microbar > .dcs-microbar-control {
  position: relative; flex: none; width: 23px; height: 20px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; border-left: 1px solid var(--border);
  border-radius: 0; color: var(--fg-dim); cursor: pointer;
  transition: color var(--dur-tint), background var(--dur-tint);
}
.dcs-microbar > button:first-child { border-left: 0; border-right: 1px solid var(--border); }
.dcs-microbar > button:hover,
.dcs-microbar > .dcs-microbar-control:hover { color: var(--fg); background: var(--bg-2); }
.dcs-microbar > button:focus-visible { outline: 2px solid var(--accent-soft-line); outline-offset: -2px; z-index: 1; }
.dcs-microbar > button:disabled { color: var(--fg-ghost); cursor: default; background: transparent; }
/* A native select hidden over its glyph — the only way to keep a picker in 20px. */
.dcs-microbar-control select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.dcs-microbar-control svg { pointer-events: none; }

/* The single solid accent fill. One per screen: the verb that runs the tool. */
.dcs-btn-primary {
  height: 28px; padding: 0 13px;
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  font: 600 12.5px/1 var(--sans);
}
.dcs-btn-primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.dcs-btn-primary:disabled { background: var(--bg-3); border-color: var(--border-strong); color: var(--fg-ghost); }

/* Accent-soft secondary — additive actions (Add, Save) that aren't the verb. */
.dcs-btn-soft {
  background: var(--accent-soft); border-color: var(--accent-soft-line);
  color: var(--accent-soft-fg); font-weight: 600;
}
.dcs-btn-soft:hover { background: #25473f; border-color: var(--accent); color: #8fe8d1; }

.dcs-btn-danger:hover { background: var(--error-bg); border-color: var(--error-soft-line); color: var(--error-fg); }

/* --- text / select / textarea ---------------------------------------- */
.dcs-input, .dcs-select, .dcs-textarea {
  width: 100%; min-width: 0; height: 28px; padding: 0 9px;
  color: var(--fg); background: var(--bg-0);
  border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  font: 12px/1 var(--sans); outline: none;
  transition: border-color var(--dur-tint), box-shadow var(--dur-tint);
}
.dcs-textarea { height: auto; min-height: 64px; padding: 7px 9px; line-height: 1.5; resize: vertical; }
.dcs-input-mono, .dcs-textarea-mono { font-family: var(--mono); font-size: 11.5px; }
.dcs-select { appearance: none; padding-right: 26px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-dim) 50%),
                    linear-gradient(135deg, var(--fg-dim) 50%, transparent 50%);
  background-position: calc(100% - 14px) 12px, calc(100% - 9px) 12px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.dcs-input:focus, .dcs-select:focus, .dcs-textarea:focus {
  border-color: var(--accent-soft-line); box-shadow: 0 0 0 2px var(--accent-ring);
}
.dcs-input::placeholder, .dcs-textarea::placeholder { color: var(--fg-faint); }
.dcs-input:disabled, .dcs-select:disabled, .dcs-textarea:disabled {
  color: var(--fg-ghost); background: var(--bg-1); border-color: var(--border); cursor: not-allowed;
}
.dcs-input.is-invalid, .dcs-textarea.is-invalid { border-color: var(--error); }

/* --- slider (NEW) ------------------------------------------------------
   Label + mono value live in .dcs-label above the track. 4px track, filled
   portion accent via a --fill custom property set by JS (0–100). */
.dcs-slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 16px; background: transparent; cursor: pointer; outline: none;
  --fill: 50%;
}
.dcs-slider::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(to right, var(--accent) 0 var(--fill), var(--bg-3) var(--fill) 100%);
  border: 1px solid var(--border-strong);
}
.dcs-slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--bg-3); border: 1px solid var(--border-strong); }
.dcs-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
.dcs-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 5px; height: 12px; margin-top: -5px; border-radius: 1px;
  background: var(--accent); box-shadow: 0 0 0 2px var(--bg-0);
  transition: box-shadow var(--dur-tint), background var(--dur-tint);
}
.dcs-slider::-moz-range-thumb {
  width: 5px; height: 12px; border-radius: 1px; border: 0;
  background: var(--accent); box-shadow: 0 0 0 2px var(--bg-0);
}
.dcs-slider:hover::-webkit-slider-thumb { background: var(--accent-hi); }
.dcs-slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 5px var(--accent-ring); }
.dcs-slider:disabled { cursor: default; }
.dcs-slider:disabled::-webkit-slider-thumb { background: var(--fg-ghost); }

/* --- checkbox / radio ------------------------------------------------- */
.dcs-check {
  display: inline-flex; align-items: center; gap: 7px;
  color: var(--fg-row); font: 12px/1.4 var(--sans); cursor: pointer; user-select: none;
}
.dcs-check input { accent-color: var(--accent); color-scheme: dark; margin: 0; }
.dcs-check:hover { color: var(--fg-strong); }

/* --- toggle pill ------------------------------------------------------ */
.dcs-toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--fg-dim); font-size: 12px; cursor: pointer; user-select: none; }
.dcs-toggle input { display: none; }
.dcs-toggle-pill {
  position: relative; width: 30px; height: 17px; border-radius: 9px;
  background: var(--bg-3); border: 1px solid var(--border-strong);
  transition: background .15s, border-color .15s;
}
.dcs-toggle-pill::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 11px; height: 11px; border-radius: 50%; background: var(--fg-faint);
  transition: transform .15s, background .15s;
}
.dcs-toggle input:checked + .dcs-toggle-pill { background: var(--accent); border-color: var(--accent); }
.dcs-toggle input:checked + .dcs-toggle-pill::after { transform: translateX(13px); background: var(--accent-ink); }

/* --- segmented control ------------------------------------------------ */
.dcs-seg {
  display: inline-flex; height: 26px; overflow: hidden;
  border: 1px solid var(--border-strong); border-radius: var(--radius-m);
}
.dcs-seg > button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 30px; height: 100%; padding: 0 10px;
  background: transparent; border: 0; color: var(--fg-dim); cursor: pointer;
  font: 500 11.5px/1 var(--sans);
  transition: background var(--dur-tint), color var(--dur-tint);
}
.dcs-seg > button + button { border-left: 1px solid var(--border-strong); }
.dcs-seg > button:hover { background: var(--border-mid); }
.dcs-seg > button.is-active { background: var(--bg-3); color: var(--accent); }

/* --- color swatch row (curated, never a free picker) ------------------ */
.dcs-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.dcs-swatch {
  width: 24px; height: 24px; padding: 0; cursor: pointer;
  border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  transition: transform var(--dur-tint), border-color var(--dur-tint);
}
.dcs-swatch:hover { transform: translateY(-1px); border-color: var(--fg-ghost); }
.dcs-swatch.is-active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }

/* ============================================================================
   NAVIGATION
   ========================================================================= */

/* --- tabs: active tab drops to the surface it opens, 2px accent top bar */
.dcs-tabs { display: flex; align-items: stretch; background: var(--bg-2); }
.dcs-tab {
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 15px;
  background: transparent; border: 0; border-right: 1px solid var(--border);
  color: var(--fg-dim); cursor: pointer; white-space: nowrap;
  font: 500 12px/1 var(--sans); letter-spacing: .03em;
}
.dcs-tab:hover { color: var(--fg); background: var(--bg-3); }
.dcs-tab.is-active {
  background: var(--bg-editor); color: var(--fg-strong); font-weight: 600;
  box-shadow: inset 0 2px 0 var(--accent);
}
/* Underline variant — for tabs inside a view, not over a surface. */
.dcs-tabs-underline { background: transparent; border-bottom: 1px solid var(--border); gap: 2px; }
.dcs-tabs-underline .dcs-tab {
  height: auto; padding: 7px 12px; border-right: 0;
  border-bottom: 2px solid transparent; font-size: 12.5px;
}
.dcs-tabs-underline .dcs-tab.is-active {
  background: transparent; color: var(--accent);
  border-bottom-color: var(--accent); box-shadow: none;
}

/* --- nav rail (SPWorkbench-style left rail) --------------------------- */
.dcs-rail {
  display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
  padding: 8px 6px; background: var(--bg-1); border-right: 1px solid var(--border);
}
.dcs-rail-label {
  padding: 10px 10px 4px;
  font: 700 9.5px/1 var(--sans); text-transform: uppercase;
  letter-spacing: .14em; color: var(--fg-faint);
}
.dcs-rail-btn {
  /* Full-width row — the whole strip is the hit target, not the label box. */
  display: flex; width: 100%; align-items: center; gap: 9px;
  height: 30px; padding: 0 10px; text-align: left; cursor: pointer;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius-m);
  color: var(--fg-row); font: 500 12.5px/1 var(--sans);
  transition: background var(--dur-tint), color var(--dur-tint);
}
.dcs-rail-btn:hover { background: var(--bg-3); color: var(--fg-strong); }
.dcs-rail-btn .dcs-rail-glyph { display: inline-flex; color: var(--fg-mid); flex: none; }
.dcs-rail-btn.is-active {
  background: var(--accent-soft); border-color: var(--accent-soft-line);
  color: var(--accent-soft-fg); box-shadow: inset 2px 0 0 var(--accent);
}
.dcs-rail-btn.is-active .dcs-rail-glyph { color: var(--accent-soft-fg); }
.dcs-rail-sep { border-top: 1px solid var(--border); margin: 6px 4px; }

/* --- breadcrumbs ------------------------------------------------------ */
.dcs-crumbs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; min-width: 0; }
.dcs-crumb {
  padding: 4px 6px; cursor: pointer;
  background: transparent; border: 0; border-radius: var(--radius-s);
  color: var(--fg-dim); font: 12px/1 var(--mono);
}
.dcs-crumb:hover { background: var(--bg-3); color: var(--fg-strong); }
.dcs-crumb.is-current { color: var(--fg); cursor: default; }
.dcs-crumb.is-current:hover { background: transparent; }
.dcs-crumb-sep { color: var(--fg-ghost); font: 12px/1 var(--mono); }

/* --- menu / dropdown -------------------------------------------------- */
.dcs-menu {
  position: absolute; z-index: 50; min-width: 200px; padding: 4px 0 6px;
  display: flex; flex-direction: column;
  background: var(--bg-2); border: 1px solid var(--border-strong);
  border-radius: var(--radius-l); box-shadow: var(--shadow-pop);
  animation: dcs-menu-in var(--dur-move) var(--ease) both;
}
@keyframes dcs-menu-in { from { opacity: 0; transform: translateY(-4px); } }
.dcs-menu-label {
  padding: 7px 11px 3px;
  font: 700 9.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase;
  color: var(--fg-faint);
}
.dcs-menu-item {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 11px;
  background: transparent; border: 0; text-align: left; cursor: pointer;
  color: var(--fg-row); font: 13px/1.3 var(--sans);
}
.dcs-menu-item:hover { background: var(--bg-3); color: var(--fg-strong); }
.dcs-menu-item:disabled { color: var(--fg-ghost); cursor: default; background: transparent; }
.dcs-menu-sep { border-top: 1px solid var(--border); margin: 5px 0; }

/* --- tree ------------------------------------------------------------- */
.dcs-tree { font: 12px/1.7 var(--mono); }
.dcs-tree-row { display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--radius-s); cursor: default; }
.dcs-tree-row.is-expandable { cursor: pointer; }
.dcs-tree-row:hover { background: var(--bg-3); }
.dcs-tree-twist { width: 12px; color: var(--fg-dim); font-size: 10px; transition: transform .1s; }
.dcs-tree-row.is-open .dcs-tree-twist { transform: rotate(90deg); }
.dcs-tree-children { padding-left: 16px; border-left: 1px solid var(--border); margin-left: 13px; }
.dcs-tree-key { color: #9cdcfe; }
.dcs-tree-str { color: #ce9178; }
.dcs-tree-num { color: #b5cea8; }
.dcs-tree-bool { color: #569cd6; }
.dcs-tree-null { color: var(--fg-faint); font-style: italic; }

/* ============================================================================
   DATA GRID
   Rules: header sticky + chrome ground · no zebra (hover is the affordance)
   · IDs/GUIDs/paths in mono · numbers right-aligned · one accent sort arrow.
   ========================================================================= */

.dcs-grid-wrap {
  flex: 1; min-height: 0; overflow: auto;
  background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-m);
}
.dcs-grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.dcs-grid th, .dcs-grid td {
  text-align: left; padding: 3px 12px; border-bottom: 1px solid var(--border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px;
}
.dcs-grid th {
  position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none;
  padding: 7px 12px;
  background: var(--bg-2); color: var(--fg-dim);
  font: 600 11px/1.4 var(--sans); letter-spacing: .04em;
  border-bottom: 1px solid var(--border-strong);
}
.dcs-grid th:hover { color: var(--fg); }
.dcs-grid th.is-sorted { color: var(--fg-strong); box-shadow: inset 0 -2px 0 var(--accent); }
.dcs-grid-sort { color: var(--accent); font-size: 10px; margin-left: 4px; }
.dcs-grid td { color: var(--fg-row); }
.dcs-grid tr:last-child td { border-bottom: 0; }
.dcs-grid tbody tr.is-openable { cursor: pointer; }
.dcs-grid tbody tr:hover td { background: var(--bg-3); color: var(--fg-strong); }
.dcs-grid tbody tr.is-selected td { background: var(--accent-soft); color: var(--fg-strong); }
.dcs-grid .dcs-num { text-align: right; font-family: var(--mono); font-size: 11.5px; }
.dcs-grid .dcs-mono { font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim); }
.dcs-grid-toolbar { display: flex; align-items: center; gap: 10px; }
.dcs-grid-count { min-width: 40px; font: 500 11.5px/1 var(--mono); color: var(--fg-dim); }
.dcs-grid-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }

/* --- list row (sidebar catalogs, file pickers) ------------------------ */
.dcs-listrow {
  position: relative; display: flex; align-items: center; gap: 9px;
  min-height: 28px; padding: 2px 6px 2px 8px; border-radius: var(--radius-s);
  cursor: pointer; user-select: none; color: var(--fg-row);
}
.dcs-listrow:hover { background: var(--bg-3); }
.dcs-listrow:hover .dcs-listrow-name { color: var(--fg-strong); }
.dcs-listrow-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcs-listrow.is-on { background: var(--bg-2); box-shadow: inset 2px 0 0 var(--accent); }
.dcs-listrow.is-on .dcs-listrow-name { color: var(--fg); font-weight: 500; }
.dcs-listrow-meta { flex: none; font: 10.5px/1 var(--mono); color: var(--fg-faint); }
/* Row tools reveal on hover/focus — opacity, not visibility (stays clickable). */
.dcs-listrow-tools { display: inline-flex; gap: 2px; }
.dcs-listrow-tools > * {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; padding: 0; opacity: 0; cursor: pointer;
  background: transparent; border: 0; border-radius: var(--radius-s); color: var(--fg-dim);
  transition: opacity var(--dur-tint), background var(--dur-tint), color var(--dur-tint);
}
.dcs-listrow:hover .dcs-listrow-tools > *,
.dcs-listrow:focus-within .dcs-listrow-tools > * { opacity: 1; }
.dcs-listrow-tools > *:hover { background: var(--border-strong); color: var(--fg-strong); }

/* ============================================================================
   NODE ICONS — folders and files
   Lucide geometry on the 24 grid, one closed path per shape, so `fill` and
   `stroke` ride the same outline and no separate tint path is needed.

     <svg class="dcs-node dcs-node-user" width="15" height="15"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
       <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9
                L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
     </svg>

   Files add the fold as a second, unfilled path:
     body <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
     fold <path d="M14 2v4a2 2 0 0 0 2 2h4"/>

   Rows rest by default. Add .is-called-out to the <svg> for the one row that
   is doing something.
   ========================================================================= */

.dcs-node { flex: none; color: var(--node-file); fill: var(--node-file-fill); }
.dcs-node-user { color: var(--node-user); fill: var(--node-user-fill); }
.dcs-node-lib  { color: var(--node-lib);  fill: var(--node-lib-fill); }
.dcs-node-sys  { color: var(--node-sys);  fill: none; }
.dcs-node-js   { color: var(--node-js);   fill: var(--node-js-fill); }
.dcs-node-html { color: var(--node-html); fill: var(--node-html-fill); }
.dcs-node-css  { color: var(--node-css);  fill: var(--node-css-fill); }
.dcs-node-json { color: var(--node-json); fill: var(--node-json-fill); }
.dcs-node-doc  { color: var(--node-doc);  fill: var(--node-doc-fill); }
/* The fold path must never take the body tint. */
.dcs-node path + path { fill: none; }

/* .dcs-node-open is the current folder; .is-called-out is everything else
   that earned brightness. Both read from -active pairs, never from raw hex. */
.dcs-node-open { color: var(--node-open); fill: var(--node-open-fill); }
.dcs-node.is-called-out.dcs-node-user { color: var(--node-user-active); fill: var(--node-user-active-fill); }
.dcs-node.is-called-out.dcs-node-lib  { color: var(--node-lib-active);  fill: var(--node-lib-active-fill); }
.dcs-node.is-called-out.dcs-node-sys  { color: var(--node-sys-active); }
.dcs-node.is-called-out.dcs-node-js   { color: var(--node-js-active);   fill: var(--node-js-active-fill); }
.dcs-node.is-called-out.dcs-node-html { color: var(--node-html-active); fill: var(--node-html-active-fill); }
.dcs-node.is-called-out.dcs-node-css  { color: var(--node-css-active);  fill: var(--node-css-active-fill); }
.dcs-node.is-called-out.dcs-node-json { color: var(--node-json-active); fill: var(--node-json-active-fill); }
.dcs-node.is-called-out.dcs-node-doc  { color: var(--node-doc-active);  fill: var(--node-doc-active-fill); }

/* Node rows are dense: these lists run to hundreds of items. */
.dcs-noderow {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) auto;
  align-items: center; gap: 8px; width: 100%;
  min-height: 24px; padding: 1px 8px; border-radius: var(--radius-s);
  color: var(--fg-row); font: 12px/1.35 var(--sans); cursor: pointer;
}
.dcs-noderow:hover { background: var(--bg-3); color: var(--fg-strong); }
.dcs-noderow.is-called-out { background: var(--bg-2); color: var(--fg-strong); }
.dcs-noderow-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcs-noderow-meta { font: 10.5px/1 var(--mono); color: var(--fg-faint); white-space: nowrap; }

/* ============================================================================
   BADGES · CHIPS · SIGNALS
   ========================================================================= */

.dcs-badge {
  display: inline-flex; align-items: center;
  padding: 2px 5px; border-radius: var(--radius-s);
  font: 600 9px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent-soft-fg); background: var(--accent-soft); border: 1px solid var(--accent-soft-line);
}
.dcs-badge[data-type="js"]   { color: var(--ft-js-fg);   background: var(--ft-js-bg);   border-color: var(--ft-js-line); }
.dcs-badge[data-type="html"] { color: var(--ft-html-fg); background: var(--ft-html-bg); border-color: var(--ft-html-line); }
.dcs-badge[data-type="css"]  { color: var(--ft-css-fg);  background: var(--ft-css-bg);  border-color: var(--ft-css-line); }
.dcs-badge[data-type="json"] { color: var(--ft-json-fg); background: var(--ft-json-bg); border-color: var(--ft-json-line); }

.dcs-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px 0 8px; border-radius: 12px; cursor: pointer;
  background: var(--bg-1); border: 1px solid var(--border-strong); color: var(--fg-dim);
  font: 500 11px/1 var(--mono); letter-spacing: .04em;
  transition: background .15s, border-color .15s, color .15s;
}
.dcs-chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-faint); }
.dcs-chip-ok { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-soft-line); }
.dcs-chip-ok .dcs-chip-dot { background: var(--ok); }
.dcs-chip-warn .dcs-chip-dot { background: var(--warn); }
.dcs-chip-err { color: var(--error-fg); background: var(--error-bg); border-color: var(--error-soft-line); }
.dcs-chip-err .dcs-chip-dot { background: var(--error); }

.dcs-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--error-bg); border: 1px solid var(--error-soft-line);
  color: var(--error-fg); font: 700 10px/1 var(--mono);
}
.is-active > .dcs-count { background: var(--error); border-color: var(--error); color: var(--error-deep); }

kbd, .dcs-kbd {
  display: inline-block; padding: 3px 6px;
  background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: var(--radius-s);
  color: var(--fg-dim); font: 500 11px/1 var(--mono);
}

/* --- notice / banner / toast ------------------------------------------ */
.dcs-notice {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 11px; border-radius: var(--radius-m);
  font: 12px/1.45 var(--sans);
  color: var(--fg-row); background: var(--bg-1); border: 1px solid var(--border);
}
.dcs-notice-info { color: var(--info); background: var(--info-soft); border-color: var(--info-soft-line); }
.dcs-notice-ok   { color: var(--ok);       background: var(--ok-soft);    border-color: var(--ok-soft-line); }
.dcs-notice-warn { color: var(--warn);     background: var(--warn-soft);  border-color: var(--warn-soft-line); }
.dcs-notice-err  { color: var(--error-fg); background: var(--error-bg);   border-color: var(--error-soft-line); }
.dcs-notice-body { flex: 1; min-width: 0; }

.dcs-toast {
  position: fixed; right: 14px; bottom: 36px; z-index: 1200;
  max-width: min(420px, calc(100vw - 28px)); padding: 9px 12px;
  color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  box-shadow: var(--shadow-pop); font-size: 12px; line-height: 1.4;
  animation: dcs-toast-in var(--dur-beat) var(--ease) both;
}
@keyframes dcs-toast-in { from { opacity: 0; transform: translateY(8px); } }

/* --- tip (NEW) ---------------------------------------------------------
   A hover/focus label for a control too small to carry text — the resize
   rail, a glyph-only microbar button. Toast paint, tint timing. Put
   .dcs-tip-host on the control; add .dcs-tip-below to drop it underneath.
   It is not a tooltip system: one short phrase, never a paragraph, and the
   control still needs a real aria-label. */
.dcs-tip-host { position: relative; }
.dcs-tip {
  position: absolute; left: calc(100% + 8px); top: 50%;
  transform: translateY(-50%); z-index: 40;
  padding: 5px 9px; white-space: nowrap; pointer-events: none;
  color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--border-strong); border-radius: var(--radius-m);
  box-shadow: var(--shadow-pop); font: 12px/1.3 var(--sans);
  opacity: 0; transition: opacity var(--dur-tint);
}
.dcs-tip-host:hover > .dcs-tip,
.dcs-tip-host:focus-visible > .dcs-tip,
.dcs-tip-host.is-dragging > .dcs-tip { opacity: 1; }
.dcs-tip-below { left: 50%; top: calc(100% + 8px); transform: translateX(-50%); }

/* --- dialog ----------------------------------------------------------- */
.dcs-dialog {
  width: min(420px, calc(100vw - 32px)); margin: auto; padding: 0;
  color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--border-strong); border-radius: var(--radius-l);
  box-shadow: var(--shadow-pop);
}
.dcs-dialog::backdrop { background: #0a0c10cc; }
.dcs-dialog-panel { display: grid; gap: 14px; padding: 16px; }
.dcs-dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dcs-dialog-head h2 { margin: 0; font: 600 15px/1.3 var(--sans); color: var(--fg); }
.dcs-dialog-context { margin: 0; color: var(--fg-dim); font: 12px/1.5 var(--sans); }
.dcs-dialog-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }

/* ============================================================================
   STATES — empty · loading · error. One mono line, centered, no illustration.
   ========================================================================= */

.dcs-state {
  display: grid; place-items: center; align-content: center; gap: 10px;
  padding: 28px; text-align: center;
  color: var(--fg-faint); font: 12px/1.55 var(--mono);
}
.dcs-state-err { color: var(--error-fg); }
.dcs-state-loading::before {
  content: ""; width: 17px; height: 17px;
  border: 2px solid var(--border-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: dcs-spin .75s linear infinite;
}
@keyframes dcs-spin { to { transform: rotate(360deg); } }

/* Skeleton: for grids and cards whose shape is known before the data lands. */
.dcs-skel {
  border-radius: var(--radius-s); background: var(--bg-3);
  background-image: linear-gradient(90deg, transparent 0, #ffffff0d 40%, transparent 80%);
  background-size: 240px 100%; background-repeat: no-repeat;
  animation: dcs-skel 1.15s linear infinite;
}
@keyframes dcs-skel { from { background-position: -240px 0; } to { background-position: calc(100% + 240px) 0; } }

/* ============================================================================
   MOTION — the complete vocabulary. Four beats, nothing else.
     tint  .12s  hover, focus, color
     move  .22s  panels, menus, chrome
     beat  .46s  a result arriving
     scan  .82s  work in progress (loops only while genuinely pending)
   ========================================================================= */

.dcs-pop { animation: dcs-pop var(--dur-beat) ease-out both; }
@keyframes dcs-pop {
  0% { opacity: .35; transform: scale(.94); }
  45% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 1; transform: scale(1); }
}
.dcs-scanline { position: absolute; left: 0; bottom: 0; width: 28%; height: 2px; background: var(--accent); opacity: 0; pointer-events: none; }
.is-sweeping .dcs-scanline { animation: dcs-scan .82s var(--ease) both; }
.is-pending  .dcs-scanline { animation: dcs-scan .82s var(--ease) infinite; }
@keyframes dcs-scan {
  0% { transform: translateX(-110%); opacity: 0; }
  10%, 85% { opacity: 1; }
  100% { transform: translateX(360%); opacity: 0; }
}
.dcs-panel-enter { animation: dcs-panel-in var(--dur-move) var(--ease) both; }
@keyframes dcs-panel-in { from { opacity: 0; transform: translateY(-6px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* --- scrollbars -------------------------------------------------------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg-1); }
::-webkit-scrollbar-thumb:hover { background: var(--fg-ghost); }

/* --- links ------------------------------------------------------------- */
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hi); text-decoration: underline; }
</style>

<style id="halo-overrides">
/* @inline halo-overrides.css - generated block, do not hand-edit.
  Edit the sibling halo-overrides.css and re-run: python inline-css.py */
/* ============================================================================
   HALO OVERRIDES
   The short list of things dcs-workbench.css does not cover, plus the few
   places Halo's own decisions win over the kit's defaults. Tokens only — no
   hex literal appears here.

   Nothing in this file paints a banner. Banner styles live in the style block
   with id halo-banner-css, which is what gets bundled into every generated
   snippet; this file is tool chrome and is never exported. Do not write a
   literal style tag in these comments - this file is inlined into the HTML,
   and a closing one would truncate the block.
   ========================================================================= */

/* --- shell -------------------------------------------------------------- */

/* Halo fills the viewport and scrolls its two columns internally, the way it
   did before the re-skin. The L2 shell deliberately leaves height to the host,
   so the tool has to state it. */
.dcs-tool { height: 100vh; }
.dcs-tool-body { flex: 1 1 auto; }

/* The control column stays at 400px rather than the kit's 360px cap: the
   colour row further down was measured to fit 400, and the kit's wider select
   arrow already spends part of that budget. */
.dcs-tool-body.has-canvas { grid-template-columns: 400px 1fr; }
@media (max-width: 720px) { .dcs-tool-body.has-canvas { grid-template-columns: 1fr; } }

/* Actions sit beside the title instead of flushed right. Halo has nothing
   right-weighted to balance them against. */
.dcs-tool-head .dcs-tool-actions { margin-left: 0; }

/* The compact-tool mark: four 6px squares on a 2px grid, no tile, no rounding.
   Opacity runs clockwise from top-left — and a 2-column grid lays children out
   in row order, so bottom-left is the fourth step, not the third. */
.dcs-mark {
 display: grid; flex: none;
 grid-template-columns: repeat(2, 6px); grid-auto-rows: 6px; gap: 2px;
}
.dcs-mark i { background: var(--accent); }
.dcs-mark i:nth-child(2) { opacity: .62; }   /* top-right */
.dcs-mark i:nth-child(3) { opacity: .2; }    /* bottom-left */
.dcs-mark i:nth-child(4) { opacity: .38; }   /* bottom-right */

/* --- controls ----------------------------------------------------------- */

/* The value readout is an <input>, not a span: click it, type a number, commit
   on Enter or blur. .dcs-value supplies the type; this strips input chrome so
   it reads as a readout until you touch it. */
.halo-value-input {
 width: 58px; padding: 0;
 border: 0; border-bottom: 1px solid transparent;
 background: transparent; text-align: right;
}
.halo-value-input:focus { outline: 0; border-bottom-color: var(--accent); }

/* Clicking a label swaps its dropdown for a free-text field, or drops focus
   into the value readout. The label has to look editable for that to be
   discoverable at all. */
.dcs-label[data-custom-for],
.dcs-label:has(.halo-value-input) {
 cursor: text; border-radius: var(--radius-s);
 transition: background var(--dur-tint), color var(--dur-tint);
}
.dcs-label[data-custom-for]:hover,
.dcs-label[data-custom-for]:focus-within,
.dcs-label:has(.halo-value-input):hover,
.dcs-label:has(.halo-value-input):focus-within { background: var(--bg-3); color: var(--fg); }

/* .dcs-slider sets width:100% but never clears the UA's default 2px margin on
   a range input, so every slider hangs 2px past its field and every row 2px
   past the panel. Harmless in a wide dialog; Halo runs fifteen of them in
   three-across columns, so it shows. Reported upstream - drop this when the
   kit fixes it. */
.dcs-slider { margin: 0; }

/* Two mono lines. The kit's 64px floor is sized for a dialog; this panel runs
   five groups down one column. */
.halo-textarea { min-height: 48px; }

/* Link row: the URL earns twice the width of the checkbox beside it. */
.halo-row-2-1 { grid-template-columns: 2fr 1fr; }

/* The kit reserves a 26px right gutter on every select, of which only the last
   10px is the arrow glyph. Halo runs three and four controls across one 400px
   column and cannot spend 16px of that on dead space: at 26px the colour
   dropdowns clip "Green #646c76" by ~5px. 18px still clears the arrow. The
   glyph itself is untouched — what goes is the gap in front of it. */
.dcs-select { padding-right: 18px; }

/* Colour row, the one place the column grid is broken. The two swatch
   dropdowns have to show a full "Green #646c76" (109px); the opacity dropdown
   never holds more than "100%" (59px), so it pays for them. Measured against
   the rendered text — re-measure if the option strings change. */
.halo-row-colors {
 grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 59px max-content;
 gap: 10px 5px;
}

/* A checkbox sharing a row with a taller control lines up with that control,
   not with the label above it. -lift is for rows of 28px inputs and selects;
   plain is for rows of 16px sliders, which already land level. */
.halo-check-field { justify-content: flex-end; }
.halo-check-field-lift { padding-bottom: 6px; }

/* --- canvas ------------------------------------------------------------- */

/* The banner hugs the top-right of the stage so its left edge stays against
   the rail. That is the whole point of the rail: drag the preview narrow and
   line it up against a real page column. */
.dcs-canvas-stage { place-items: start stretch; }
.halo-stage-row {
 display: flex; align-items: stretch; justify-content: flex-end;
 gap: 6px; min-width: 0;
}
.halo-stage-inner {
 position: relative; flex: 0 1 auto;
 width: min(100%, 900px); min-width: 160px; max-width: 100%;
 box-shadow: var(--shadow-pop);
}

/* --- generated code ----------------------------------------------------- */

.halo-code-view { padding: 12px 14px; }
.halo-code {
 margin: 0; padding: 10px;
 border: 1px solid var(--border); border-radius: var(--radius-m);
 background: var(--bg-editor); color: var(--fg-row);
 font: 11.5px/1.6 var(--mono);
 white-space: pre-wrap; overflow-wrap: anywhere;
}
</style>


<style id="halo-banner-css">
/* ############################################################
  HALO BANNER: component styles. The Copy Code button bundles
  this whole block into the generated snippet automatically,
  so pasted banners are self-contained.
  Geometry locked to the .ai file:
    inner clip dia 1154.1324, outer dia 1201.1213 + 9 stroke
    -> visual outer edge 1210.1213, artboard width 1024
  ############################################################ */
/* Dax Pro is not a system font: serve it yourself. Fill in real
  paths and drop the comment markers, or delete this block and the
  stack falls back to Segoe UI.
@font-face { font-family:"Dax Pro"; src:url("DaxPro-Light.woff2") format("woff2");  font-weight:300; }
@font-face { font-family:"Dax Pro"; src:url("DaxPro-Regular.woff2") format("woff2"); font-weight:400; }
@font-face { font-family:"Dax Pro"; src:url("DaxPro-Medium.woff2") format("woff2");  font-weight:500; }
@font-face { font-family:"Dax Pro"; src:url("DaxPro-Bold.woff2") format("woff2");   font-weight:700; }
*/
.halo-banner-link {
 display: block;
 text-decoration: none;
 color: inherit;
}
.halo-banner {
 container-type: inline-size;
 position: relative;
 --ab-h: 682.67;                       /* artboard height, width = 1024 units */
 aspect-ratio: 1024 / var(--ab-h);
 overflow: hidden;
 width: 100%;
 border-radius: var(--banner-radius, 0);
 background: transparent;
 isolation: isolate;
}
.halo-banner::before {
 content: "";
 position: absolute;
 z-index: 0;

 background-image: var(--banner-image, none);
 background-position: center;
 background-size: cover;
}
.halo-banner::after {
 content: "";

 z-index: 0;
 inset: 0;

 mix-blend-mode: var(--banner-blend, normal);
 pointer-events: none;
}
/* ---- the halo (both circles as one welded unit) ---- */
.halo {
 --size: calc(118.1759cqw * var(--scale, 1));
 position: absolute;
 z-index: 1;
 left: calc(var(--x, 31.63) * 1%);
 top: calc(var(--y, 48.8) * 1%);
 transform: translate(-50%, -50%) scale(1);
 width: var(--size);
 aspect-ratio: 1;

 place-items: center;
 margin: 0;
 transition: transform .35s cubic-bezier(.2,.7,.3,1);
}
.halo::after {
 content: "";
 position: absolute;
 inset: 0;
 box-sizing: border-box;
 border-radius: 50%;
 border: calc(var(--size) * var(--ring-weight, 9) / 1210.1213) solid var(--ring-color, #fff);
 pointer-events: none;
}
.halo__clip {
 width: calc(var(--size) * 0.95373);
 aspect-ratio: 1;
 clip-path: circle(50%);
}
.halo__img {
 width: 100%;
 height: 100%;
 object-fit: cover;
 object-position: var(--photo-x, 50%) var(--photo-y, 50%);
 transform: scale(var(--photo-zoom, 1));
 transform-origin: var(--photo-x, 50%) var(--photo-y, 50%);

}
/* ---- text overlay (always top z) ---- */
.halo__text {
 position: absolute;
 z-index: 3;
 left: calc(var(--text-x, 70) * 1%);
 top: calc(var(--text-y, 50) * 1%);
 transform: translate(-50%, -50%);
 /* sizes are in artboard units: n / 10.24 = cqw */
 width: var(--text-w, auto);
 height: var(--text-h, auto);
 padding: var(--text-pad-y, 0) var(--text-pad-x, 0);
 border-radius: var(--text-radius, 0);
 font-family: var(--text-font, "Dax Pro"), "Segoe UI", system-ui, sans-serif;
 font-weight: var(--text-weight, 400);

 color: var(--text-color, #fff);

}
.halo__text-bg {

.halo__text-bg * { color: transparent !important; }
/* span helpers for inline overrides; inline style="" also works */

.halo-banner-link.has-link:hover .halo,

}
