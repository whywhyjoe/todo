<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The inline English below is authored fallback: the page reads fine
     in source and degrades to EN if scripts fail. apply() overwrites it. -->
<title data-i18n="app.title">Client Onboarding</title>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; color: #222; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  #langToggle { background: none; border: none; color: #0057b8; cursor: pointer; font-size: 1rem; text-decoration: underline; }
  .search { display: flex; gap: .5rem; margin: 1rem 0; }
  .search input { flex: 1; padding: .4rem .6rem; }
  .muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>

<header>
  <h1 data-i18n="app.title">Client Onboarding</h1>
  <!-- Canadian convention: the toggle names the OTHER language.
       The dictionary handles that naturally — no special casing. -->
  <button id="langToggle" data-i18n="ui.langToggle" lang="fr">Français</button>
</header>

<p data-i18n-html="app.intro">Track <strong>new client</strong> requests through review and approval.</p>

<div class="search">
  <input type="search"
         data-i18n-attr="placeholder:search.placeholder;title:search.tooltip"
         placeholder="Search by client name…">
  <button data-i18n="search.button">Search</button>
</div>

<!-- Everything below is script-rendered via I18N.t() -->
<p id="greeting"></p>
<p id="count"></p>
<p id="updated" class="muted"></p>
<p id="exportHint" class="muted"></p>

<script src="i18n.js"></script>
<script src="strings.js"></script>
<script>
(function () {
  'use strict';

  function locale() {
    return I18N.getLang() === 'fr' ? 'fr-CA' : 'en-CA';
  }

  function render() {
    // The toggle is labelled in the language it switches TO — keep its
    // lang attribute pointing there so screen readers pronounce it right.
    document.getElementById('langToggle')
      .setAttribute('lang', I18N.getLang() === 'en' ? 'fr' : 'en');
    document.getElementById('greeting').textContent =
      I18N.t('results.greeting', { name: 'Joe' });
    document.getElementById('count').textContent =
      I18N.t('results.count', { count: (1234).toLocaleString(locale()) });
    document.getElementById('updated').textContent =
      I18N.t('results.updated', {
        date: new Intl.DateTimeFormat(locale(), { dateStyle: 'long' }).format(new Date())
      });
    // Untranslated key: falls back to English, gets logged for report().
    document.getElementById('exportHint').textContent =
      I18N.t('results.exportHint');
  }

  document.getElementById('langToggle').addEventListener('click', function () {
    I18N.setLang(I18N.getLang() === 'en' ? 'fr' : 'en');
  });

  I18N.apply();
  render();
  I18N.onChange(render);
  I18N.report(); // console: keys still waiting on French
})();
</script>
</body>
</html>
